openapi: 3.0.0
info:
  title: Threat Intelligence Dashboard API
  version: 0.1.0
paths:
  /indicators:
    get:
      summary: Query indicators
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search term (IP, domain, hash)
        - name: source
          in: query
          schema:
            type: string
          description: Filter by feed source
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: A list of indicators
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        value:
                          type: string
                        last_seen:
                          type: string
                          format: date-time
